controller_server:
  ros__parameters:
    controller_frequency: 15.0
    failure_tolerance: 0.0
    publish_zero_velocity: true

    PidTrackingController:
      plugin: "pid_tracking_controller::PidTrackingController"
      goal_dist_tolerance: 0.05
      rotate_tolerance: 0.5
      base_frame: "base_link"
      map_frame: "map"
      lookahead_time: 1.0
      min_lookahead_dist: 0.5
      max_lookahead_dist: 0.9
      max_v: 0.6
      min_v: 0.05
      max_v_inc: 0.5
      max_w: 0.8
      min_w: 0.0
      max_w_inc: 0.2
      k_v_p: 2.0
      k_v_i: 0.01
      k_v_d: 0.10
      k_w_p: 1.0
      k_w_i: 0.01
      k_w_d: 0.10
      k_theta: 0.5
      model_k_v: 1.7
      model_k_w: 1.9
      l: 0.2
      cruise_speed: 0.6
      angular_speed_reserve: 0.10
      enable_start_heading_alignment: true
      start_heading_enter_tolerance: 0.3
      start_heading_exit_tolerance: 0.15
      start_heading_kp: 1.0
      kp_yaw: 1.0
      kp_x: 1.0
      kp_y: 1.0
      nominal_tracking_speed: 0.80
      max_vx: 0.80
      max_vy: 0.40
      max_xy_speed: 0.80
      max_omega: 0.60
      max_ax: 0.20
      max_ay: 0.20
      max_alpha: 0.50
      a_ref_up: 0.20
      a_ref_down: 0.20
      yaw_feedback_reserve: 0.05
      configured_min_rate_window: 0.30
      control_gap_threshold: 0.50
      rotation_yaw_tolerance: 0.05
      rotation_omega_tolerance: 0.05
      rotation_xy_speed_tolerance: 0.05
      rotation_settle_time: 0.30
      pid_frequency: 15.0
      use_model: true
