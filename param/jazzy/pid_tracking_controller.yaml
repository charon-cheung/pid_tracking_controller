controller_server:
  ros__parameters:
    controller_frequency: 15.0
    failure_tolerance: 0.0
    publish_zero_velocity: true

    PidTrackingController:
      plugin: "pid_tracking_controller::PidTrackingController"
      # Opt-in nominal execution gate; enabled separately in the Webots overlay.
      execution_safety.enabled: false
      base_frame: "base_link"
      lookahead_time: 1.0
      min_lookahead_dist: 0.5
      max_lookahead_dist: 0.9
      kp_yaw: 1.0
      # Independent in-place turn gain and response-delay allowance (seconds).
      rotation_kp_yaw: 3.0
      rotation_response_delay: 0.20
      # Odom-rate angular feedback low-pass (seconds); 0 disables. Stop checks stay raw.
      omega_feedback_filter_tau: 0.05
      # Fixed-heading translation only; thresholds are yaw errors in radians (2 / 1 degrees).
      fixed_heading_yaw_hold: true
      fixed_heading_yaw_enter_error: 0.03490658503988659
      fixed_heading_yaw_exit_error: 0.017453292519943295
      kp_x: 1.0
      kp_y: 1.0
      nominal_tracking_speed: 0.8   # 0.8
      max_vx: 0.8
      max_vy: 0.5
      max_xy_speed: 1.0
      max_omega: 0.60
      max_ax: 1.1
      max_ay: 1.1
      # Unified turn tracking budget (m/s^2); final axis limits retain max_ax/max_ay.
      max_translation_curve_accel: 0.35
      # Hold feedforward acceleration during confirmed outward error growth in translation.
      tracking_guard_enter_error: 0.03  # metres
      tracking_guard_exit_error: 0.015  # metres
      tracking_guard_min_outward_speed: 0.02  # m/s; outward velocity or position-error growth
      tracking_guard_confirm_time: 0.15  # seconds, entry
      tracking_guard_release_confirm_time: 0.40  # seconds, sustained small error before release
      max_alpha: 0.50
      # In-place turn acceleration after stop confirmation; braking still uses max_alpha.
      rotation_max_alpha: 0.80
      a_ref_up: 0.80
      a_ref_down: 0.40
      # Plan conservatively; keep normal acceleration and command braking separate.
      stopping_deceleration: 0.40
      # Total pose/odometry age, control-cycle and drive-response budget (seconds).
      stopping_delay: 0.50
      # Combined approach speed with margin above the 0.01 m/s per-axis drive deadband.
      stopping_min_speed: 0.06
      max_decel_x: 0.60
      max_decel_y: 0.60
      yaw_feedback_reserve: 0.05
      configured_min_rate_window: 0.30
      control_gap_threshold: 0.50
      rotation_yaw_tolerance: 0.05
      rotation_omega_tolerance: 0.05
      rotation_xy_speed_tolerance: 0.05
      rotation_settle_time: 0.30
      rotation_stop_confirm_time: 0.20  # Measured and commanded speed must stay near zero.
      rotation_braking_timeout: 8.0   # Failure to stop raises NoValidControl, never forces a turn.
